[package]
name = "pdfium_bridge"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "pdfium_bridge"

[dependencies]
jni = "0.21"
once_cell = "1.19"
log = "0.4"
android_logger = "0.15"
libc = "0.2"
regex = "1.10"
thiserror = "1.0"
hound = "3.5"
lopdf = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
[package]
name = "pdfium_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
once_cell = "1.19"
log = "0.4"
android_logger = "0.15"
libc = "0.2"
regex = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"